<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brawl Arena 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{--ac:#ffc83d;--ac2:#ff8a1f;--glass:#ffffff14;--line:#ffffff26;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:radial-gradient(120% 120% at 30% 20%,#3b3fb8,#161a5c 55%,#0b1238);font-family:'Lilita One','Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;letter-spacing:.3px}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;pointer-events:none}
#rot{position:fixed;inset:0;z-index:99;background:#0b1238;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:22px;text-align:center;padding:20px}
#rot i{font-style:normal;font-size:64px;animation:rt 2s infinite}
@keyframes rt{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media(orientation:portrait){#rot{display:flex}}
#sp{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 120% at 50% 30%,#3b3fb8,#0b1238);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:auto}
#sp .lg{font-size:min(12vw,84px);color:var(--ac);text-shadow:0 6px 0 #0009;letter-spacing:2px}
#sp .sb{font-size:22px;animation:bl 1.2s infinite alternate}@keyframes bl{to{opacity:.35}}
.pill{background:#0a0e30aa;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:15px;white-space:nowrap}
.pill.big{font-size:26px;padding:8px 20px}
.ib{background:#0a0e30aa;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;color:#fff;font-size:17px;pointer-events:auto;font-family:inherit}
.b{background:linear-gradient(#ffe066,var(--ac2));color:#2b1700;border:0;border-radius:14px;padding:10px 14px;font:inherit;font-size:17px;box-shadow:0 4px 0 #a85d00;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #a85d00}.b small{font-size:11px;opacity:.75}
.b.g{background:linear-gradient(#7be07b,#2eaa4a);box-shadow:0 4px 0 #17702d;color:#06240d}
.b.x{background:linear-gradient(#8a90b8,#555a85);box-shadow:0 4px 0 #2d3157;color:#fff}
.b.sm{padding:4px 10px;font-size:13px;border-radius:10px;box-shadow:0 2px 0 #17702d;align-items:center}
.tag{display:inline-block;padding:1px 10px;border-radius:10px;font-size:12px;color:#1b1000;vertical-align:middle}
/* menu principal */
#m>*{position:absolute;pointer-events:auto}
#prof{left:calc(var(--sl) + 14px);top:calc(var(--st) + 10px);display:flex;gap:10px;align-items:center;background:#0a0e30aa;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:5px 16px 5px 5px}
#pav{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -4px 0 #0004}
#pn{font-size:16px;line-height:1.1}#pt{font-size:13px;opacity:.85}
#cur{right:calc(var(--sr) + 14px);top:calc(var(--st) + 10px);display:flex;gap:8px;align-items:center}
#rail{left:calc(var(--sl) + 14px);top:calc(var(--st) + 76px);display:flex;flex-direction:column;gap:10px}
#rail button{position:relative;width:62px;height:62px;border-radius:18px;border:1px solid var(--line);background:#0a0e30aa;backdrop-filter:blur(8px);color:#fff;font:inherit;font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#rail button small{font-size:10px;margin-top:2px}#rail button:active{transform:scale(.94)}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#ff3b5c;font-size:11px;font-style:normal;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
#hi{left:calc(var(--sl) + 100px);bottom:calc(var(--sb) + 16px)}
#hn{font-size:38px;text-shadow:0 4px 0 #0009;line-height:1}
#hl2{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:16px}
#pl{right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 16px);display:flex;flex-direction:column;gap:10px;width:min(38vw,290px)}
#chip{background:#0a0e30cc;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;color:#fff;font:inherit;font-size:19px;text-align:left;padding:10px 14px;display:flex;flex-direction:column}
#chip small{font-size:12px;opacity:.8}
#go{height:76px;border:0;border-radius:22px;background:linear-gradient(#ffe066,#ff9a1f);color:#3a2100;font:inherit;font-size:38px;box-shadow:0 6px 0 #a85d00,0 0 30px #ffb34755;animation:gl 1.6s infinite alternate}
@keyframes gl{to{transform:scale(1.03)}}#go:active{transform:translateY(4px);box-shadow:0 2px 0 #a85d00}
/* pages */
#pg{display:none;flex-direction:column;pointer-events:auto;background:linear-gradient(180deg,#151b5af7,#0b1238fa);padding:var(--st) var(--sr) var(--sb) var(--sl);z-index:3}
#pg.split{background:linear-gradient(90deg,#0000 0,#0000 34%,#0b1238f0 34%)}
#pgh{display:flex;align-items:center;gap:10px;padding:10px 14px}#pgt{font-size:26px;margin-right:auto;text-shadow:0 3px 0 #0008}
#pgb{flex:1;overflow:auto;padding:4px 16px 16px;touch-action:pan-y;display:flex;flex-direction:column;gap:12px;animation:sl .3s both}
#pg.split #pgb{margin-left:34%}
@keyframes sl{from{opacity:0;transform:translateY(14px)}}
#pgb::-webkit-scrollbar{display:none}
h4{font-size:16px;opacity:.9;margin-top:4px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;touch-action:pan-x;flex:none}.strip::-webkit-scrollbar{display:none}
.tl{flex:0 0 66px;position:relative;background:var(--glass);border:2px solid var(--line);border-radius:14px;padding:6px 2px 8px;text-align:center;font-size:11px;overflow:hidden}
.tl.on{border-color:var(--ac);background:#ffffff30}.tl.lk{opacity:.65}.tl::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc,#fff4)}
.av{width:38px;height:38px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font-size:17px;box-shadow:inset 0 -4px 0 #0004,0 2px 0 #0005}
.hd{display:flex;flex-direction:column;gap:7px}.hnm{font-size:28px}.lvl{font-size:14px;background:#ffffff24;border-radius:10px;padding:1px 9px;vertical-align:middle}
.sr{display:flex;align-items:center;gap:8px;font-size:12px}.sr span{width:74px}
.bar{flex:1;height:9px;background:#0006;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.sp2{font-size:12px;line-height:1.45;background:#0a0e30aa;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.acts{display:flex;gap:10px;align-items:center}
.road{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;touch-action:pan-x;flex:none}.road::-webkit-scrollbar{display:none}
.rn{flex:0 0 104px;min-height:112px;background:var(--glass);border:2px solid var(--line);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;font-size:14px;gap:4px}
.rn.ok{border-color:#4cff6a;background:#4cff6a22;animation:gl 1s infinite alternate}.rn b{font-size:15px;color:var(--ac);font-weight:400}
.hr .rn{flex-basis:84px;min-height:96px;font-size:12px}
.rtop{display:flex;align-items:center;gap:10px;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cx{background:var(--glass);border:2px solid var(--c,var(--line));border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:15px}
.cx .cb{font-size:44px;filter:drop-shadow(0 0 12px var(--c,#fff))}.cx small{opacity:.75;font-size:12px}
.mc{display:flex;align-items:center;gap:14px;border:0;border-radius:20px;padding:14px 16px;color:#fff;font:inherit;text-align:left;box-shadow:0 5px 0 #0007,inset 0 2px 0 #fff4;width:100%}
.mc:active{transform:translateY(3px)}.mc .mi{font-size:38px}.mc b{font-size:24px;display:block;font-weight:400;text-shadow:0 2px 0 #0005}.mc small{display:block;font-size:12px;opacity:.92}.mc.on{outline:3px solid #fff}
.empty{text-align:center;font-size:20px;margin:auto;opacity:.85;line-height:1.6}
/* modales */
#rv,#dm{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;gap:10px;pointer-events:auto}
#rv{z-index:10;align-items:flex-start;padding:0 8vw 0 54vw;background:radial-gradient(circle at 28% 50%,#ffd54a44,#000d 65%)}
#dm{z-index:12;align-items:center;background:radial-gradient(circle,#2a2f8acc,#000e)}
.rvt{font-size:30px;color:var(--ac);animation:pp2 .6s}.rvn{font-size:64px;line-height:1;text-shadow:0 5px 0 #000a;animation:pp2 .7s}.rvi{font-size:18px;line-height:1.6}
.rvn2{font-size:34px;animation:pp2 .5s}.drw{font-size:96px;animation:pp2 .6s;filter:drop-shadow(0 0 30px #ffd54a)}
@keyframes pp2{from{transform:scale(2.2);opacity:0}}
.dbox{font-size:min(30vh,150px);filter:drop-shadow(0 0 40px var(--c));animation:fl2 1.4s infinite alternate}.dbox.shk{animation:shk .13s infinite}
.dt{font-size:36px}.dh{font-size:18px;opacity:.8;animation:bl 1s infinite alternate}
@keyframes fl2{to{transform:translateY(-10px) scale(1.04)}}@keyframes shk{0%{transform:rotate(-8deg) scale(1.1)}50%{transform:rotate(8deg) scale(1.15)}100%{transform:rotate(-8deg) scale(1.1)}}
.cf{position:fixed;top:-20px;width:10px;height:16px;animation:cf 3s linear infinite;z-index:13;pointer-events:none}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
/* HUD */
#h{display:none}
#sc{position:absolute;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:8px}
#hl{position:absolute;top:calc(var(--st) + 8px);left:calc(var(--sl) + 10px)}
#hr{position:absolute;top:calc(var(--st) + 8px);right:calc(var(--sr) + 10px)}
#kf{position:absolute;top:calc(var(--st) + 58px);right:calc(var(--sr) + 10px);display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px}
#kf div{background:#000a;padding:3px 10px;border-radius:10px;animation:fd 3s forwards}@keyframes fd{80%{opacity:1}100%{opacity:0}}
#hpw{position:absolute;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);width:min(34vw,260px)}
#hpw .bar{height:20px;border:2px solid #fff7;background:#0008}#hpw .bar i{background:linear-gradient(#8cff8c,#25b53e);transition:width .15s}#hpn{display:inline-block;margin-bottom:3px}#hpn small{font-size:12px;color:#8cff8c}
#sb{position:absolute;right:calc(var(--sr) + 150px);bottom:calc(var(--sb) + 30px);width:70px;height:70px;border-radius:50%;border:4px solid #fff;font-size:32px;pointer-events:auto;background:conic-gradient(var(--ac) calc(var(--p)*1%),#000a 0);color:#fff;display:grid;place-items:center;--p:0}
#sb.rd{animation:pl .5s infinite alternate;box-shadow:0 0 26px var(--ac)}@keyframes pl{to{transform:scale(1.14)}}
#an{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:80px;text-shadow:0 6px 0 #0009,0 0 30px #000;opacity:0}
#an.pop{animation:pp .9s ease-out}@keyframes pp{0%{transform:scale(2.4);opacity:0}15%{opacity:1}70%{transform:scale(1);opacity:1}100%{opacity:0}}
#vg{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px #f00;opacity:0;transition:opacity .3s}
#dn{position:fixed;inset:0;pointer-events:none;z-index:5}
.dn{position:absolute;font-size:26px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:fl .8s ease-out forwards;transform:translate(-50%,-50%)}@keyframes fl{to{transform:translate(-50%,-190%) scale(.8);opacity:0}}
.jk{position:fixed;width:104px;height:104px;border-radius:50%;border:3px solid #fff7;background:#fff2;display:none;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
.jk i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#fffd}
#r{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;z-index:8}
#r h1{font-size:64px;font-weight:400;text-shadow:0 5px 0 #0009;color:var(--ac)}
#ts{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#000d;padding:8px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#nav{left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 16px);display:flex;gap:8px}
#nav button{position:relative;width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:#0a0e30aa;backdrop-filter:blur(8px);color:#fff;font:inherit;font-size:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#nav button small{font-size:9px;margin-top:2px}#nav button:active{transform:scale(.94)}
#daily{left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 86px);font-size:14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ht{position:relative;background:var(--glass);border:2px solid var(--line);border-radius:16px;padding:8px 4px 10px;text-align:center;font-size:13px;overflow:hidden;display:flex;flex-direction:column;gap:2px;align-items:center}
.ht::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--rc)}.ht.on{border-color:var(--ac);background:#ffffff30}.ht.lk{opacity:.8}.ht b{font-weight:400;font-size:15px}.lvb{font-size:11px;opacity:.9}
.hhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hnm{font-size:30px}
.gl{display:flex;flex-direction:column;gap:6px}.gi{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px}.gi small{opacity:.75}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 12px;gap:10px;font-size:15px}
.rn.pn{min-height:170px}.rn .pr{color:#ffd54a;font-size:12px}
.set{display:flex;flex-direction:column;gap:10px;max-width:520px}.set label{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:17px}.set input[type=range]{width:55%}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:14px;color:#fff;font:inherit;font-size:16px;padding:10px 14px;text-align:left}
.tg i{flex:0 0 44px;height:24px;border-radius:12px;background:#0006;position:relative}.tg i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg.on i{background:#2eaa4a}.tg.on i::after{left:23px}
#ab{position:absolute;right:calc(var(--sr) + 26px);bottom:calc(var(--sb) + 26px);width:104px;height:104px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 35% 30%,#ff7b7b,#d21f2f);font-size:36px;pointer-events:auto;box-shadow:0 6px 0 #7a0f1a;touch-action:none}
#sb{right:calc(var(--sr) + 150px);bottom:calc(var(--sb) + 30px);width:70px;height:70px;touch-action:none}
#gb{position:absolute;right:calc(var(--sr) + 40px);bottom:calc(var(--sb) + 144px);width:60px;height:60px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#7be07b,#1e8f3a);font-size:20px;color:#fff;pointer-events:auto;display:none;place-items:center;touch-action:none;font-family:inherit}

</style></head>
<body>
<canvas id="cv"></canvas>
<div id="rot"><i>📱</i>Tourne ton téléphone<br>en mode paysage pour jouer</div>
<div id="sp"><div class="lg">BRAWL ARENA</div><div class="sb">Touche l'écran pour jouer 🎵</div></div>
<div class="ov" id="m">
 <div id="prof"><div id="pav"></div><div><div id="pn">Joueur</div><div id="pt"></div></div></div>
 <div id="cur"><span class="pill c-co"></span><span class="pill c-gm"></span><span class="pill c-pp"></span><button class="ib" id="mu">🔊</button><button class="ib" data-a="pg" data-v="settings">⚙️</button></div>
 <div id="daily" class="pill" data-a="pg" data-v="quests"></div>
 <div id="nav">
  <button data-a="pg" data-v="heroes">🦸<small>Héros</small><i class="dot" id="d-heroes"></i></button>
  <button data-a="pg" data-v="shop">🛒<small>Boutique</small><i class="dot" id="d-shop"></i></button>
  <button data-a="pg" data-v="road">🏆<small>Trophées</small><i class="dot" id="d-road"></i></button>
  <button data-a="pg" data-v="pass">🎟️<small>Passe</small><i class="dot" id="d-pass"></i></button>
  <button data-a="pg" data-v="quests">📜<small>Quêtes</small><i class="dot" id="d-quests"></i></button>
  <button data-a="pg" data-v="drops">🎁<small>Prix</small><i class="dot" id="d-drops"></i></button>
 </div>
 <div id="pl"><button id="chip" data-a="pg" data-v="modes"></button><button id="go" data-a="play">JOUER</button></div>
</div>
<div class="ov" id="pg"><div id="pgh"><button class="ib" data-a="back">←</button><span id="pgt"></span><span class="pill c-co"></span><span class="pill c-gm"></span><span class="pill c-pp"></span></div><div id="pgb"></div></div>
<div class="ov" id="h">
 <div id="hl"><button class="ib" id="pb">⏸</button></div>
 <div id="sc"><span class="pill" id="s1"></span><span class="pill" id="tm"></span></div>
 <div id="hr"><button class="ib" id="mu2">🔊</button></div><div id="kf"></div>
 <div id="hpw"><div class="pill" id="hpn"></div><div class="bar"><i id="hpb"></i></div></div>
 <button id="ab">🔴</button><button id="sb">⚡</button><button id="gb">🔧</button><div id="an"></div><div id="vg"></div>
</div>
<div id="dn"></div><div class="jk" id="jl"><i></i></div>
<div id="rv"></div><div id="dm"></div><div id="r"></div><div id="ts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const RN=['Starter','Rare','Super rare','Épique','Mythique','Légendaire'],RC=['#b0b8c4','#4cd964','#3fa9ff','#b36bff','#ff4d5a','#ffd23f'],PRC=[0,300,600,1000,1600,2500],RM=[1,1.04,1.08,1.13,1.18,1.25];

function act(e){const a=e.target.closest('[data-a]');if(!a)return;aud();const k=a.dataset.a,v=a.dataset.v;snd('click');
